            !document.mozFullScreenElement && !document.webkitFullscreenElement) {  // current working methods
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.mozRequestFullScreen) {
                document.documentElement.mozRequestFullScreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
            }
        } else {
            if (document.cancelFullScreen) {
                document.cancelFullScreen();
            } else if (document.mozCancelFullScreen) {
                document.mozCancelFullScreen();
            } else if (document.webkitCancelFullScreen) {
                document.webkitCancelFullScreen();
            }
        }
    }

<script>
    groups_chart = null
    qod_chart = null
    font_size = 12
    fm_boxs = null
    sounds = {}


    SIGNALS = {
        sood: "sood",
        codeBeCode: "codeBeCode",
        ehtemalArze: "ehtemalArze",
        rangeMosbat: "rangeMosbat",
        rangeManfi: "rangeManfi",
        taharok: "taharok",
        astane: "astane",
        safeKharid: "safeKharid",
        taharokSafeKharid: "taharokSafeKharid",
        boxGhodratmand: "boxGhodratmand",
        vol: "vol",
        safeForooshValue: "safeForooshValue",
        safeKharidValue: "safeKharidValue",
        hotMoney: "hotMoney",
        afzayeshSarmaye: "afzayeshSarmaye",
    }

    Object.keys(SIGNALS).forEach(function (signalName) {
        sounds[signalName] = null
    })

    function inc_font() {
        font_size++
        for (i = 0; i < fm_boxs.length; i++) {
            $(fm_boxs[i])
                .removeClass(function (index, className) {
                    return (className.match(/(^|\s)signal-size-\S+/g) || []).join(' ');
                })
                .addClass("signal-size-" + (font_size));
        }
    }

    function red_font() {
        font_size--
        for (i = 0; i < fm_boxs.length; i++) {
            $(fm_boxs[i])
                .removeClass(function (index, className) {
                    return (className.match(/(^|\s)signal-size-\S+/g) || []).join(' ');
                })
                .addClass("signal-size-" + (font_size));
        }
    }

    function getSignalIdByName(name) {
        const map = {
            "codeBeCode": "code",
            "ehtemalArze": "arze",
            "rangeMosbat": "range",
            "rangeManfi": "range",
            "taharok": "taharok",
            "astane": "astane",
            "safeKharid": "saf",
            "taharokSafeKharid": "saf",
            "boxGhodratmand": "power-box",
            "vol": "vol",
            "safeForooshValue": "safeForooshValue",
            "safeKharidValue": "safeKharidValue",
            "hotMoney": "hotMoney",
            "afzayeshSarmaye": "afzayeshSarmaye",
            "sood": "sood",
        }
        return map[name]
    }

    function makeSignalRow(signal, badges = [], add_time = true, new_signal = true, tooltip = true) {
        let now = new Date()
        let badge = "";
        if (add_time) {
            badge = '<span class="badge badge-warning">' + now.getHours() + ':' + now.getMinutes() + '</span>'
        }

        badges.forEach(function (badges) {
            badge += '<span class="badge badge-' + badges.class + '">' + badges.msg + '</span>'
        })

        new_signal = new_signal ? "new-signal" : "";
        var html = ""
        if (tooltip && signal.Info) {
            Object.keys(signal.Info).forEach(function (key) {
                var val = signal.Info[key]
                html += "<li>" + key + ":<i>" + val + "</i></li>"
            })
        }

        if (html) {
            html = "<ul>" + html + "</ul>"
            return $('<div data-toggle="tooltip" data-html="true" title="' + html + '" class="signal-row ' + new_signal + '">' + signal.NameFa + ' ' + badge + '</div>');
        }
        return $('<div class="signal-row ' + new_signal + '">' + signal.NameFa + ' ' + badge + '</div>');
    }

    function addSignal(signal) {
        if (
            signal.Signal === SIGNALS.astane ||
            // signal.Signal === SIGNALS.hotMoney ||
            // signal.Signal === SIGNALS.astane ||
            // signal.Signal === SIGNALS.safeKharid ||
            !!0
        ) {
            console.warn(signal)

        }
        let id = "#" + getSignalIdByName(signal.Signal)
        let box = $(id)
        let signalRow;
        if (sounds[signal.Signal] !== null) {
            sounds[signal.Signal].play()
        }
        if (signal.Signal === SIGNALS.boxGhodratmand) {
            let badges = []
            switch (signal.Info.type) {
                case "both":
                    badges.push({msg: "🟡", class: "warning"})
                    break;
                case "kharid":
                    badges.push({msg: "🟢", class: "success"})
                    break;
                case "foroosh":
                    badges.push({msg: "🔴", class: "danger"})
                    break;
            }
            signalRow = makeSignalRow(signal, badges)
        } else if (signal.Signal === SIGNALS.afzayeshSarmaye) {
            let badges = []
            switch (signal.Info.type) {
                case "P":
                    badges.push({msg: "📜", class: "info"})
                    break;
                default:
                case "M":
                    badges.push({msg: "✅", class: "success"})
                    break;
            }
            badges.push({msg: signal.Info.percent + "%", class: "warning"})
            signalRow = makeSignalRow(signal, badges)
        } else if (signal.Signal === SIGNALS.sood) {
            let badges = []
            if (parseInt(signal.Info["diff%"]) < 0) {
                badges.push({msg: "🔻" + signal.Info["diff%"]+"%", class: "info"})
            } else {
                badges.push({msg: "🔺" + signal.Info["diff%"]+"%", class: "success"})
            }
            signalRow = makeSignalRow(signal, badges)
        } else if (signal.Signal === SIGNALS.rangeManfi) {
            let badges = []
            badges.push({msg: "🔻", class: "danger"})
            signalRow = makeSignalRow(signal, badges)
        } else if (signal.Signal === SIGNALS.rangeMosbat) {
            let badges = []
            badges.push({msg: "🔺", class: "success"})
            signalRow = makeSignalRow(signal, badges)
        } else if (signal.Signal === SIGNALS.taharokSafeKharid) {
            let badges = []
            badges.push({msg: "🛫", class: "success"})
            signalRow = makeSignalRow(signal, badges)
        } else if (signal.Signal === SIGNALS.safeKharid) {
            let badges = []
            badges.push({msg: "🆕", class: "info"})
            signalRow = makeSignalRow(signal, badges)
        } else if (signal.Signal === SIGNALS.hotMoney) {
            let badges = []
            if (signal.Info.type === "buy") {
                badges.push({msg: signal.Info.value + "B", class: "success"})
            } else {
                badges.push({msg: signal.Info.value + "B", class: "danger"})
            }
            signalRow = makeSignalRow(signal, badges)
        } else {
            signalRow = makeSignalRow(signal)
        }
        box.prepend(signalRow)
        signalRow.tooltip()
        setTimeout(() => {
            signalRow.removeClass("new-signal")
        }, 10000)
    }

    function formatNum(num, digit, divide) {
        num = parseFloat(num) / divide
        return parseFloat(num).toFixed(digit)
    }

    function updateLists(_id, obj) {
        let id = "#" + getSignalIdByName(_id)
        let box = $(id)
        window.ooo = obj
        box.html("")
        obj.forEach((signal, index) => {
            try {
                let signalRow = "";
                if (_id === "safeForooshValue") {
                    signalRow = makeSignalRow(signal, [{
                        msg: formatNum(signal["SortValue"], 2, 1e10),
                        class: "danger"
                    }], false, false, false)
                } else if (_id === "safeKharidValue") {
                    signalRow = makeSignalRow(signal, [{
                        msg: formatNum(signal["SortValue"], 2, 1e10),
                        class: "success"
                    }], false, false, false)
                } else if (_id === "vol") {
                    signalRow = makeSignalRow(signal, [{

                    }], false, false, false)
                }
                box.append(signalRow)
            } catch (e) {
                console.error(e)
            }
        });

    function updateGroupCharts(signal) {
        // console.warn(signal)
        window.s = signal

        const listOfGroupPowerColor = signal.ListOfGroupPower.map(function (item) {
            return item < 0 ? 'rgba(219,48,152,0.75)' : 'rgba(0,220,28,0.75)'
        })
        const listOfGroupRangeColor = signal.ListOfGroupRange.map(function (item) {
            return item < 0 ? '#FE53BB' : '#00ff41'
        })
        console.log(signal.ListOfGroupName)
        groups_chart.data.labels = signal.ListOfGroupName
        console.log(groups_chart.data.labels)
        groups_chart.data.datasets[0].data = signal.ListOfGroupRange
        groups_chart.data.datasets[1].data = signal.ListOfGroupPower
        groups_chart.data.datasets[0].backgroundColor = listOfGroupRangeColor
        groups_chart.data.datasets[1].backgroundColor = listOfGroupPowerColor
        groups_chart.update();
    }

    function updateAskBidCharts(signal) {
        // console.warn(signal)
        var label = signal.StepOfOrderValue;
        if (label.length < 300) {
            var last = label[label.length - 1]
            var tmp = Array.from(Array(300 - label.length).keys())
            tmp = tmp.map(function (item) {
                return last + item
            })
            label = label.concat(tmp)
        }
        var now = new Date()
        now.setHours(7)
        now.setMinutes(0)
        now.setSeconds(0)
        now.setMilliseconds(0)
        var nowunix = now.getTime()
        label = label.map(function (value) {
            var tmp = new Date(nowunix + value * 60000)
            return tmp.getHours() + ":" + tmp.getMinutes()
        })
        qod_chart.data.labels = label
        qod_chart.data.datasets[0].data = signal.BidValueOfOrders
        qod_chart.data.datasets[1].data = signal.AskValueOfOrders
        qod_chart.update();
    }

    function fileExists(url) {
        try {
            var http = new XMLHttpRequest();
            http.open('HEAD', url, false);
            http.send();
            return http.status == 200;
        } catch {
            return false
        }
    }

    function loadSounds() {
        if (window.sound) {
            Object.keys(sounds).forEach(function (signalName) {
                var url = "http://" + window.sound + "/" + signalName + ".mp3"
                if (fileExists(url)) {
                    var ad = new Audio(url);
                    ad.load()
                    sounds[signalName] = ad;
                    sounds[signalName].load();
                }
            })
        } else {
            setTimeout(loadSounds, 1000)
        }
    }
